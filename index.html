<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Marauder's Map</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay">
    <div class="welcome">
        <h1>The Marauder's Map</h1>

        <p class="quote">
            "I solemnly swear that I am up to no good."
        </p>

        <button id="openMap">
            Open the Map
        </button>
    </div>
</div>

<div class="mapPage">

    <header>
        <h1>🗺 The Marauder's Map</h1>

        <p>
            Click any location to discover its secrets.
        </p>
    </header>

    <section class="map">

        <div class="location" onclick="showInfo('hall')">
            🏰
            <h3>Great Hall</h3>
        </div>

        <div class="location" onclick="showInfo('library')">
            📚
            <h3>Library</h3>
        </div>

        <div class="location" onclick="showInfo('potions')">
            🧪
            <h3>Potions</h3>
        </div>

        <div class="location" onclick="showInfo('tower')">
            🔭
            <h3>Astronomy Tower</h3>
        </div>

        <div class="location" onclick="showInfo('forest')">
            🌲
            <h3>Forbidden Forest</h3>
        </div>

        <div class="location" onclick="showInfo('houses')">
            🏆
            <h3>Houses</h3>
        </div>

    </section>

    <section class="infoBox">

        <h2 id="title">
            Welcome!
        </h2>

        <p id="description">
            Choose a location from the map to begin your magical journey.
        </p>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
